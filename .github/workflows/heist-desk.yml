name: Heist Desk

on:
  pull_request:
    paths:
      - "src/spiral_ln/hack_game.py"
      - "src/spiral_ln/staged_hacks.py"
      - "src/spiral_ln/hack_controls.py"
      - "configs/crypto_hack_corpus.json"
      - "configs/heist_content.json"
      - "configs/software_catalog.json"
      - "ui/play/**"
      - "tests/test_hack_game.py"
      - ".github/workflows/heist-desk.yml"
  push:
    branches: [master]
    paths:
      - "src/spiral_ln/hack_game.py"
      - "src/spiral_ln/staged_hacks.py"
      - "src/spiral_ln/hack_controls.py"
      - "configs/crypto_hack_corpus.json"
      - "configs/heist_content.json"
      - "configs/software_catalog.json"
      - "ui/play/**"
      - "tests/test_hack_game.py"
      - ".github/workflows/heist-desk.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Exporter, content and page tests
        env:
          PYTHONPATH: src
        run: python -m pytest tests/test_hack_game.py -q
      - name: Committed game data and page are current
        env:
          PYTHONPATH: src
        run: |
          python -m spiral_ln.hack_game --out /tmp/scenarios.json
          cmp /tmp/scenarios.json ui/play/scenarios.json || { echo "::error::ui/play/scenarios.json is stale: rerun python -m spiral_ln.hack_game"; exit 1; }
          python ui/play/build_play.py --out /tmp/index.html
          cmp /tmp/index.html ui/play/index.html || { echo "::error::ui/play/index.html is stale: rerun python ui/play/build_play.py"; exit 1; }
          echo "::notice::Heist Desk data and page are current"
