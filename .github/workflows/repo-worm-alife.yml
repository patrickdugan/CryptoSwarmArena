name: Repo Worm ALife sealed gym

on:
  pull_request:
    paths:
      - "src/spiral_ln/repo_worm_alife.py"
      - "tests/test_repo_worm_alife.py"
      - "configs/repo_worm_alife_v1.json"
      - "docs/repo_worm_alife*.md"
      - ".github/workflows/repo-worm-alife.yml"
  push:
    branches: [master]
    paths:
      - "src/spiral_ln/repo_worm_alife.py"
      - "tests/test_repo_worm_alife.py"
      - "configs/repo_worm_alife_v1.json"
      - "docs/repo_worm_alife*.md"
      - ".github/workflows/repo-worm-alife.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Unit tests and instrument invariants
        env:
          PYTHONPATH: src
        run: python -m pytest tests/test_repo_worm_alife.py -q
      - name: Frozen 128-episode campaign and deterministic verification
        env:
          PYTHONPATH: src
        run: |
          python -m spiral_ln.repo_worm_alife --config configs/repo_worm_alife_v1.json --output output/repo_worm_alife_v1 --events
          python -m spiral_ln.repo_worm_alife --verify output/repo_worm_alife_v1
