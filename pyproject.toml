[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-swarm-arena"
version = "0.1.0"
description = "Red Team Gladiatorics: a sealed, synthetic control-evaluation instrument for crypto-security agent behavior (RTG-0 kernel, feral-custody family, historical-hack corpus, and the diorama arena viewer)"
requires-python = ">=3.11"
dependencies = [
  "matplotlib>=3.7",
  "networkx>=3.0",
  "numpy>=1.24",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]
