[package]
name = "diorama_engine"
version = "0.1.0"
edition = "2021"
description = "Per-frame animation core for the Hive Swarm diorama viewer: walking, gait, poses and instance matrices, compiled to WebAssembly"
publish = false

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
